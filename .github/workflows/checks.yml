name: PR checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install FFmpeg for audio regressions
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: npm run test:auth
      - run: npm run test:audio
      - name: Browser audio regressions
        timeout-minutes: 5
        run: |
          google-chrome --version
          npm run test:audio:browser
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:agent-queue
      - run: npm run build
      - run: npm run build-storybook
      - run: node scripts/assemble-pages.mjs
      - name: Execute every Storybook story and play
        timeout-minutes: 8
        run: npm run test:stories
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg sqlite3 nginx
          sqlite3 --version
          ffmpeg -version
          ffprobe -version
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go version && go env GOVERSION GOOS GOARCH
      - run: go mod download
      - run: go mod verify
      - run: go test -count=1 ./...
      - run: go vet ./...
      - name: Proxy logs never contain public tokens
        run: python3 ../scripts/check-proxy-logs.py
      - run: go build -o /tmp/choral-server ./cmd/server

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci --no-audit --no-fund
      - name: Install real audio tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          google-chrome --version
          ffmpeg -version
          ffprobe -version
      - name: Real HTTP SQLite FFmpeg and browser flows
        run: npm run test:e2e
