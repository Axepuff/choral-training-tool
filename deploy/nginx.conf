# Dedicated nginx instance: replace choir.example.test before installation.
# Do not overwrite the config of a host that already serves other applications.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/null;
events {}
http {
    access_log off;
    error_log /dev/null;
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name choir.example.test;
        location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
        location / { return 308 https://choir.example.test$request_uri; }
    }
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name choir.example.test;
        ssl_certificate /etc/letsencrypt/live/choir.example.test/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/choir.example.test/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 101m;
        client_body_timeout 30s;
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 35s;
            proxy_read_timeout 35s;
        }
    }
}
